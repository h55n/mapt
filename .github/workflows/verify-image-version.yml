name: Verify Azure image version handling
on:
  push:
    branches: [verify/azure-image-version-nov21]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache
          sudo docker image prune --all --force
          sudo apt-get clean
          mkdir -p /home/runner/work/gotmp
          df -h /
      - name: Build
        env:
          GOTMPDIR: /home/runner/work/gotmp
        run: make build GCFLAGS=""
      - name: Full tests
        run: make test
      - name: Lint
        env:
          GOTMPDIR: /home/runner/work/gotmp
        run: make lint
      - name: Repeated race regression
        run: go test -race -p 1 --tags build ./pkg/provider/azure/data -run TestGetImageRef -count=25
      - name: Formatting and whitespace
        run: |
          test -z "$(gofmt -l pkg/provider/azure/data/imageref.go pkg/provider/azure/data/imageref_test.go)"
          git diff --check HEAD~2...HEAD
          git diff --exit-code
