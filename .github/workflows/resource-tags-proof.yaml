name: resource-tags-private-proof

on:
  workflow_dispatch:
  push:
    branches:
      - test-resource-tags-20261101
permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache \
          /usr/local/graalvm /usr/local/.ghcup /usr/local/share/chromium \
          /usr/local/share/powershell /usr/share/az_* \
          /usr/local/julia* /usr/share/miniconda /usr/local/share/edge_driver \
          /usr/local/share/gecko_driver /usr/local/share/vcpkg \
          /usr/local/lib/heroku /usr/share/kotlinc /usr/share/sbt \
          /usr/share/gradle-* /usr/share/apache-maven-* \
          /usr/lib/jvm /usr/lib/firefox /usr/lib/mono \
          /usr/lib/google-cloud-sdk /usr/lib/heroku 2>/dev/null || true
        sudo docker image prune --all --force 2>/dev/null || true
        sudo apt-get clean 2>/dev/null || true
        sudo swapoff -a && sudo rm -f /swapfile 2>/dev/null || true
        mkdir -p /home/runner/work/gotmp
        df -h /

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: true

    - name: Build
      env:
        GOTMPDIR: /home/runner/work/gotmp
      run: make build GCFLAGS=""

    - name: Test
      run: make test

    - name: Lint
      env:
        GOTMPDIR: /home/runner/work/gotmp
      run: make lint

    - name: Regression must fail on base
      shell: bash
      run: |
        cp pkg/manager/context/context.go /tmp/context-fixed.go
        git show eb9096591bc4a649121338206bb2d6315301ed3d:pkg/manager/context/context.go > pkg/manager/context/context.go
        set +e
        go test --tags build ./pkg/manager/context -run TestResourceTagsWithCustom -count=1 > /tmp/red.log 2>&1
        result=$?
        set -e
        cat /tmp/red.log
        cp /tmp/context-fixed.go pkg/manager/context/context.go
        test "$result" -ne 0
        grep -q -- "--- FAIL: TestResourceTagsWithCustomCallOrder" /tmp/red.log
        grep -q -- "--- FAIL: TestResourceTagsWithCustomNilBase" /tmp/red.log
        grep -q -- "--- FAIL: TestResourceTagsWithCustomPerResource" /tmp/red.log
        go test --tags build ./pkg/manager/context -run TestResourceTagsWithCustom -count=25

    - name: Clean Go build cache
      run: go clean -cache

  context-race:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Native context race test
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
        run: go test -race -p 1 --tags build ./pkg/manager/context -count=25

  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Native build
        run: go build ./cmd/mapt
      - name: Native full tests
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '1'
        run: go test -p 1 --tags build -v ./pkg/... ./cmd/... -skip github.com/mapt-oss/pulumi-ibmcloud/sdk/go/...
