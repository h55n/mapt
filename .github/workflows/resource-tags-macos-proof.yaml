name: resource-tags-macos-bounded-proof
on:
  push:
    branches: [test-resource-tags-macos-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Native build with bounded package parallelism
        run: go build -p 1 ./cmd/mapt
      - name: Native full tests
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '1'
        run: go test -p 1 --tags build -v ./pkg/... ./cmd/... -skip github.com/mapt-oss/pulumi-ibmcloud/sdk/go/...
